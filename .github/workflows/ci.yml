name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile audit tools
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: Run smoke tests
        run: python3 tests/smoke_test.py
